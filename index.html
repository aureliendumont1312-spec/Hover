<!DOCTYPE html>
<html>
<head>
<style>
.image-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.image-container img {
  width: 100%;
  display: block;
}

.image-top {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.image-container:hover .image-top {
  opacity: 1;
}
</style>
</head>
<body>
<div class="image-container">
  <img src="https://methodwakfu.com/wp-content/uploads/2019/01/PaturagesBouftous_Salle1_SansVT.jpg" class="image-bottom" alt="Plan 1">
  <img src="https://methodwakfu.com/wp-content/uploads/2019/01/PaturagesBouftous_Salle1_AvecVT.jpg" class="image-top" alt="Plan 2">
</div>
</body>
</html>
